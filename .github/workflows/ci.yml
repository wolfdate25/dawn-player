name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore DawnPlayer.slnx

      - name: Build Solution (Debug)
        run: dotnet build DawnPlayer.slnx -c Debug --no-restore

      - name: Run Unit Tests (with coverage)
        run: >
          dotnet test tests/DawnPlayer.Tests/DawnPlayer.Tests.csproj -c Debug --no-build
          --verbosity normal
          --logger "trx;LogFileName=test_results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory tests/DawnPlayer.Tests/TestResults

      - name: Generate Coverage Summary
        if: always()
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"tests/DawnPlayer.Tests/TestResults/**/coverage.cobertura.xml" -targetdir:"coverage-report" -reporttypes:"MarkdownSummaryGithub;Html"
          if (Test-Path coverage-report/SummaryGithub.md) {
            Get-Content coverage-report/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report
          if-no-files-found: ignore

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: tests/DawnPlayer.Tests/TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Build Solution (Release)
        run: dotnet build DawnPlayer.slnx -c Release --no-restore

  test-arm64:
    name: Build & Test (ARM64)
    runs-on: windows-11-arm
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore DawnPlayer.slnx

      - name: Build Solution (Release)
        run: dotnet build DawnPlayer.slnx -c Release --no-restore

      - name: Run Unit Tests
        shell: pwsh
        run: |
          # Same retry contract as the release workflow: one spurious failure under a loaded
          # runner retries once, so flakes are distinguishable from real ARM64 breaks.
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            dotnet test tests/DawnPlayer.Tests/DawnPlayer.Tests.csproj -c Release --no-build --verbosity normal
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "::warning::Test attempt $attempt failed with exit $LASTEXITCODE$(if ($attempt -eq 1) { '; retrying...' } else { '' })"
          }
          exit 1

  package-dry-run:
    name: Packaging Dry-Run (${{ matrix.runtime }})
    runs-on: windows-latest
    timeout-minutes: 30
    needs: test

    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress

      - name: Run Build & Packaging Automation
        run: pwsh -File tools/build-installer.ps1 -Version "0.0.0-ci" -Runtime "${{ matrix.runtime }}"

      - name: Upload Installer Dry-Run Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dawnplayer-ci-build-${{ matrix.runtime }}
          path: |
            dist/installer/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
