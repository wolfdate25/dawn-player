<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dawn Player — 하단바 평점 아이콘 Treatment 비교</title>
<style>
  :root {
    --bg: #18181D; --panel: #1F1F25; --card: #27272F;
    --text: #F3F3F6; --text2: #AEAEBC; --text3: #8F8FA0;
    --accent: #E8A33D; --separator: #2F2F39; --sel-color: #4CC2FF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #121216; color: var(--text);
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    padding: 20px 24px; display: flex; flex-direction: column; gap: 14px;
  }
  h1 { font-size: 16px; font-weight: 600; }
  .sub { color: var(--text2); font-size: 12px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tabs button {
    background: var(--panel); border: 1px solid var(--separator); color: var(--text2);
    border-radius: 6px; padding: 7px 13px; font-size: 12px; cursor: pointer;
  }
  .tabs button.active { border-color: var(--accent); color: var(--accent); }

  /* 하단바 재현 */
  .bar {
    background: var(--bg); border: 1px solid var(--separator); border-radius: 8px;
    padding: 8px 14px 10px; width: 720px;
  }
  .seek { display: flex; align-items: center; gap: 10px; font-size: 10.5px; color: var(--text3); margin-bottom: 6px; }
  .seek .line { flex: 1; height: 3px; border-radius: 2px; background: #3D3D49; position: relative; }
  .seek .line::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8%; background: var(--accent); }
  .seek .line::after { content: ""; position: absolute; left: 8%; top: -3.5px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .row { display: flex; align-items: center; gap: 14px; }
  .art {
    width: 44px; height: 44px; border-radius: 5px; background: linear-gradient(135deg, #4A3B6B, #1E1B4B);
    flex: none;
  }
  .info { width: 230px; flex: none; }
  .info .t { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
  .info .a { font-size: 11.5px; color: var(--text2); margin: 2px 0 4px; }
  .badges { display: flex; gap: 4px; }
  .badge { font-size: 10px; color: var(--text2); background: #2A2A34; border-radius: 3px; padding: 1px 6px; }

  .transport { display: flex; align-items: center; gap: 18px; flex: 1; justify-content: center; }
  .tbtn { font-size: 15px; color: var(--text2); font-family: "Segoe Fluent Icons","Segoe MDL2 Assets"; }
  .tbtn.play {
    width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #141414;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .right { display: flex; align-items: center; gap: 16px; font-family: "Segoe Fluent Icons","Segoe MDL2 Assets"; font-size: 14px; color: var(--text2); flex: none; }

  /* 평점 스타일들 */
  .rate-text { font-size: 12px; color: var(--accent); }         /* 현행: 텍스트 별 + 앰버 */
  .rate-icon { font-family: "Segoe Fluent Icons","Segoe MDL2 Assets"; font-size: 13px; color: var(--text2); }
  .rate-icon.rated { color: var(--accent); }
  .rate-inline { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text3); }
  .rate-inline .st { font-family: "Segoe Fluent Icons","Segoe MDL2 Assets"; font-size: 11px; }
  .rate-inline.rated { color: var(--text2); }
  .rate-inline.rated .st { color: var(--accent); }

  .desc { width: 340px; }
  .desc .name { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .desc .why { font-size: 12px; color: var(--text2); line-height: 1.65; }
  .desc .why b { color: var(--text); }
  .desc .geo { margin-top: 8px; font-family: Consolas, monospace; font-size: 10.5px; color: #C8C8D4;
    background: var(--panel); border: 1px solid var(--separator); border-radius: 6px; padding: 8px;
    white-space: pre-wrap; user-select: all; }
</style>
</head>
<body>
  <div>
    <h1>하단바 평점 아이콘 Treatment 비교</h1>
    <div class="sub">미평점(위) · 3점 평점(아래) 두 상태를 함께 비교 — 탭으로 전환, 하나를 선택하세요</div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="stage" style="display:flex;gap:18px;align-items:flex-start;">
    <div class="bar">
      <div class="seek"><span>0:08</span><div class="line"></div><span>-3:49</span></div>
      <div class="row">
        <div class="art"></div>
        <div class="info">
          <div class="t">
            <span style="overflow:hidden;text-overflow:ellipsis;">품삯다는 것은 다시 시작된다는 것을</span>
            <span id="rate-slot"></span>
          </div>
          <div class="a">강아유</div>
          <div class="badges"><span class="badge">WAV · 32bit/48kHz</span><span class="badge">WASAPI 배타</span></div>
        </div>
        <div class="transport">
          <span class="tbtn">&#xE8B1;</span>
          <span class="tbtn">&#xE892;</span>
          <span class="tbtn play">&#xE768;</span>
          <span class="tbtn">&#xE89A;</span>
          <span class="tbtn">&#xE71A;</span>
          <span class="tbtn">&#xE8EE;</span>
          <span style="font-size:12px;color:var(--text2);">A–B</span>
        </div>
        <div class="right"><span>&#xE767;</span><span>&#xE8FD;</span><span>&#xE8D6;</span></div>
      </div>
    </div>
    <div class="desc">
      <div class="name" id="d-name"></div>
      <div class="why" id="d-why"></div>
      <div class="geo" id="d-geo"></div>
    </div>
  </div>

<script>
/* rate slot 렌더: 미평점(위쪽 미리보기는 unrated 하나만 표시) */
const VARIANTS = {
  A: {
    name: "A — Segoe 아이콘 통일 + 무채색 미평점",
    why: "텍스트 별(★☆, 본문 폰트)을 <b>Segoe Fluent 아이콘</b>으로 교체해 하단바 아이콘 계열을 통일합니다. 미평점은 <b>회색</b>(다른 아이콘과 동일한 무채색)으로 낮추고, 평점이 있을 때만 앰버 채움 별로 바뀝니다. 위치는 그대로 — 최소 변경으로 이질감 ①(폰트)·②(색)를 해결.",
    unrated: '<span class="rate-icon">&#xE735;</span>',
    rated: '<span class="rate-icon rated">&#xE734;</span>',
    geo: `TrackRatingButton 내용 교체:
  미평점: FontIcon E735 (TextSecondary)
  평점 o: FontIcon E734 (DawnAccentTextBrush)
+ 별점 문자열("★★★") 미사용
+ 컨버터 유지 (자동명 그대로)`,
  },
  B: {
    name: "B — 평점 표시형 (별 + 숫자)",
    why: "A에 더해 <b>현재 평점을 값으로 표시</b>합니다(예: 별 아이콘 + 3). 평점을 매겨둔 트랙이 한눈에 식별되고, 클릭하면 기존 플라이아웃이 열립니다. 미평점은 A와 동일한 회색 아웃라인 — 정보 표시 강화가 필요하면 이쪽.",
    unrated: '<span class="rate-icon">&#xE735;</span>',
    rated: '<span class="rate-inline rated"><span class="st">&#xE734;</span> 3</span>',
    geo: `TrackRatingButton 내용 교체:
  미평점: FontIcon E735 (TextSecondary)
  평점 o: FontIcon E734 + "N" 캡션 (앰버)
+ StackPanel 수평 정렬 필요`,
  },
  C: {
    name: "C — 우측 미니 클러스터 이동",
    why: "평점 버튼을 제목 행에서 <b>우측 클러스터(볼륨·대기열·가사) 옆</b>으로 옮깁니다. 아이콘 계열·크기·색이 이미 통일된 자리라 자연스럽고, 제목 행이 길어질 때 겹침 여지도 사라집니다. 트랙 정보 바로 옆에서 평점을 매기던 L11 동선은 바뀝니다.",
    unrated: '<span class="rate-icon" style="font-size:14px;">&#xE735;</span>',
    rated: '<span class="rate-icon rated" style="font-size:14px;">&#xE734;</span>',
    geo: `제목 행에서 TrackRatingButton 제거
우측 클러스터에 FontIcon 버튼 추가
  미평점 E735 / 평점 E734 (앰버)
+ 플라이아웃·자동명 로직 이동`,
  },
  D: {
    name: "D — 하단바에서 제거",
    why: "평점 입구를 하단바에서 빼고 <b>라이브러리·재생목록 표의 별점 셀 + 컨텍스트 메뉴</b>로 유지합니다(기능 자체는 그대로). 하단바는 재생 조작에만 집중 — 미니멀을 최우선하면 이쪽. 단, 재생 중 트랙을 바로 평가하는 동선은 사라집니다.",
    unrated: '<span style="font-size:11px;color:var(--text3);">(없음)</span>',
    rated: '<span style="font-size:11px;color:var(--text3);">(없음)</span>',
    geo: `TrackRatingButton/플라이아웃 제거
UpdateTrackRatingCell 등 코드 정리
+ 라이브러리 표 평점 셀은 유지 (L11)`,
  },
};

const slot = document.getElementById("rate-slot");
const tabs = document.getElementById("tabs");
Object.keys(VARIANTS).forEach(k => {
  const b = document.createElement("button");
  b.textContent = `${k} — ${VARIANTS[k].name.split("— ")[1]}`;
  b.dataset.v = k;
  b.addEventListener("click", () => select(k));
  tabs.appendChild(b);
});
function select(k) {
  const v = VARIANTS[k];
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.v === k));
  slot.innerHTML = v.unrated;
  document.getElementById("d-name").textContent = v.name;
  document.getElementById("d-why").innerHTML = v.why;
  document.getElementById("d-geo").textContent = v.geo;
}
select("A");
</script>
</body>
</html>
