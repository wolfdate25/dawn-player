<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dawn Player — 사이드바 트리 변형 비교 (A·B·C·D)</title>
<style>
  :root {
    --bg: #18181D; --panel: #1F1F25; --card: #27272F; --card-hover: #32323C;
    --text: #F3F3F6; --text2: #AEAEBC; --text3: #8F8FA0;
    --accent: #E8A33D; --separator: #2F2F39; --sel-color: #4CC2FF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #121216; color: var(--text);
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    padding: 20px 24px; display: flex; flex-direction: column; gap: 14px;
  }
  h1 { font-size: 16px; font-weight: 600; }
  .sub { color: var(--text2); font-size: 12px; }
  .sub b { color: var(--accent); }

  /* ── 탭 ── */
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tabs button {
    background: var(--panel); border: 1px solid var(--separator); color: var(--text2);
    border-radius: 6px; padding: 8px 14px; font-size: 12px; cursor: pointer; text-align: left;
  }
  .tabs button b { display: block; color: var(--text); font-size: 12.5px; margin-bottom: 2px; }
  .tabs button.active { border-color: var(--accent); background: #26E8A31F; }
  .tabs button.active b { color: var(--accent); }

  /* ── 변형 패널 ── */
  .stage { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
  .frame {
    background: var(--bg); border: 1px solid var(--separator); border-radius: 8px;
    width: 300px; overflow: hidden; flex: none;
  }
  .titlebar {
    height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
    border-bottom: 1px solid var(--separator); font-size: 11px; color: var(--text3);
  }
  .titlebar .brand { color: var(--text); font-weight: 600; font-size: 12px; }
  .sidebar { padding: 10px 8px 8px; }
  .side-header { font-size: 11px; font-weight: 600; color: var(--text3); margin: 0 4px 8px; }
  .combo {
    background: var(--card); border: 1px solid var(--separator); border-radius: 4px;
    font-size: 12px; color: var(--text); padding: 5px 10px; margin: 0 2px 8px;
  }
  .combo::after { content: "⌄"; color: var(--text3); float: right; }
  ul.tree { list-style: none; }
  ul.tree li { position: relative; }

  /* 행 — 변형 값은 CSS 변수로 주입 */
  .tree .row {
    display: flex; align-items: center;
    margin: var(--m-v) var(--m-h);
    padding: var(--pv) var(--ph);
    height: calc(var(--rh) + var(--extra-v));
    border-radius: var(--radius);
    background: var(--row-bg, transparent);
    cursor: default;
  }
  .tree .row:hover { background: var(--card); }
  .tree .row.sel { background: var(--sel-bg); }
  .tree .row.sel::before {
    content: ""; position: absolute; left: 0; top: 18%; bottom: 18%;
    width: 3px; border-radius: 2px; background: var(--sel-color);
  }
  .tree .chev {
    width: var(--chev-w); margin-right: var(--gap-chev);
    font-size: 9px; color: var(--text3); text-align: center; flex: none;
  }
  .tree .indent1 { margin-left: 14px; }
  .tree .title {
    font-size: var(--font-t); color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
    margin-right: var(--gap-count);
  }
  .tree .count { font-size: var(--font-c); color: var(--text3); flex: none; margin-right: var(--count-r); }

  /* ── 설명 패널 ── */
  .desc { width: 380px; display: flex; flex-direction: column; gap: 10px; }
  .desc .name { font-size: 15px; font-weight: 600; }
  .desc .why { font-size: 12px; color: var(--text2); line-height: 1.65; }
  .desc .why b { color: var(--text); }
  .geo {
    background: var(--panel); border: 1px solid var(--separator); border-radius: 6px;
    padding: 10px; font-family: Consolas, monospace; font-size: 11px; line-height: 1.7;
    color: #C8C8D4; white-space: pre-wrap; user-select: all;
  }
  .geo .k { color: var(--accent); }
  .pick { font-size: 12px; color: var(--text3); }
</style>
</head>
<body>
  <div>
    <h1>사이드바 트리 변형 비교 — 하나를 선택하세요</h1>
    <div class="sub">브라우저 배율 <b>100%</b> · 모든 변형은 실제 앱 데이터이며, 선택 = <b>변형 알파벳</b>만 말씀하시면 적용합니다 (예: "C로 해줘")</div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="stage">
    <div class="frame">
      <div class="titlebar"><span class="brand">Dawn Player</span><span>— 미리보기</span></div>
      <div class="sidebar">
        <div class="side-header">Library Tree</div>
        <div class="combo">Folder Structure</div>
        <ul class="tree" id="tree"></ul>
      </div>
    </div>
    <div class="desc">
      <div class="name" id="d-name"></div>
      <div class="why" id="d-why"></div>
      <div class="geo" id="d-geo"></div>
      <div class="pick">↖ 미리보기에서 행에 마우스를 올려 촉감도 비교해 보세요.</div>
    </div>
  </div>

<script>
const treeData = [
  { t: "All", c: "1,309", chev: "˅" },
  { t: "C:\\Users\\kongdol\\AppData\\Local…", c: "109", chev: "˅" },
  { t: "DawnPlayer_Concur_4505973a5…", c: "450" },
  { t: "DawnPlayer_Concur_ci4b17c9…", c: "10" },
  { t: "DawnPlayer_SpecialChars_1d7042…", c: "6" },
  { t: "DawnPlayer_Stress_DiskRace_8…", c: "16" },
  { t: "DawnPlayer_Stress_DiskRace_9…", c: "17" },
  { t: "DawnPlayer_Stress_IoLock_9d4…", c: "20" },
  { t: "DawnPlayer_Stress_IoLock_993…", c: "20" },
  { t: "DawnPlayer_TestLib_0154e4692…", c: "2" },
  { t: "DawnPlayer_TestLib_aa8ff800546…", c: "2" },
  { t: "나음악소장", c: "1,199", chev: "˅" },
  { t: "일본", c: "405", indent: true },
  { t: "일본", c: "470", indent: true, sel: true },
  { t: "한국", c: "324", indent: true },
];

const VARIANTS = {
  A: {
    name: "A — 이전 레이아웃 (WinUI 기본 복원)",
    why: "커스텀 템플릿 적용 전, <b>원래 쓰시던 모습의 근사 복원</b>. 여유 있는 셰브런 칸과 기본 여백을 그대로 되돌립니다. 근거: 익숙함이 최선의 UX일 수 있음 — 바뀐 것 자체가 부담이면 원점 복귀가 정답입니다. 셰브런 칸이 넓어 아래 단계 행들이 안쪽으로 들어가 보이던 계층감도 돌아옵니다.",
    css: { "--rh": "26px", "--pv": "2px", "--ph": "0px", "--m-v": "0px", "--m-h": "4px",
           "--extra-v": "2px", "--chev-w": "26px", "--gap-chev": "0px",
           "--gap-count": "6px", "--count-r": "6px", "--font-t": "12px", "--font-c": "11px",
           "--radius": "4px", "--sel-bg": "#26E8A33D", "--row-bg": "transparent" },
    geo: `행 피치: 약 32px (본체 26 + 기본 여백)
셰브런 칸: 26px (글리프 12 + 패딩 14)
글자: 제목 12px · 카운트 11px
적용: EoleTreeItemStyle에서 원본 값 복원`,
  },
  B: {
    name: "B — 현재 (컴팩트 커스텀)",
    why: "방금 적용한 값 그대로. <b>화면에 최대 정보량</b> — pro 도구 밀도 관례(foobar2000 계열)에 맞춘 가장 촘촘한 선택. 15행이 모두 한 화면에 들어옵니다. 근거: ui-ux-pro-max 밀도 다이얼 high — 라이브러리 탐색 도구에서는 밀도가 탐색 효율을 높입니다.",
    css: { "--rh": "26px", "--pv": "1px", "--ph": "1px", "--m-v": "0px", "--m-h": "1px",
           "--extra-v": "0px", "--chev-w": "8px", "--gap-chev": "1px",
           "--gap-count": "6px", "--count-r": "6px", "--font-t": "12px", "--font-c": "11px",
           "--radius": "4px", "--sel-bg": "#26E8A33D", "--row-bg": "transparent" },
    geo: `행 피치: 28px (본체 26 + 패딩 1×2)
셰브런 칸: 8px · 간격 1px
글자: 제목 12px · 카운트 11px
적용: 현재 상태 유지 (변경 없음)`,
  },
  C: {
    name: "C — Eole 리듬 (목록 높이 통일)",
    why: "행 피치를 <b>트랙 목록(34px)과 정확히 일치</b>시켜 좌우 패널의 수직 리듬을 맞춥니다. 근거: ui-ux-pro-max 레이아웃 — 같은 화면의 목록들은 같은 스페이싱 스케일을 공유해야 리듬이 읽힘(MASTER --space 스케일 정신). 셰브런도 살짝 키워 계층 기호를 눞히기 쉽게 유지.",
    css: { "--rh": "26px", "--pv": "4px", "--ph": "4px", "--m-v": "0px", "--m-h": "2px",
           "--extra-v": "0px", "--chev-w": "10px", "--gap-chev": "4px",
           "--gap-count": "8px", "--count-r": "8px", "--font-t": "12.5px", "--font-c": "11px",
           "--radius": "4px", "--sel-bg": "#26E8A33D", "--row-bg": "transparent" },
    geo: `행 피치: 34px (본체 26 + 패딩 4×2) = 트랙 목록과 동일
셰브런 칸: 10px · 간격 4px
글자: 제목 12.5px · 카운트 11px
적용: EoleTreeItemStyle 값 교체 (Padding 4,4 · 셰브런 10)`,
  },
  D: {
    name: "D — 카드형 여유 (modern soft)",
    why: "행 사이 2px 공극 + 둥근 카드 배경으로 <b>현대적 소프트 룩</b>. 호버·선택이 카드 단위로 명확히 분리됩니다. 근거: ui-ux-pro-max — 인접 클릭 대상 간 간격 원칙의 행 버전(공극으로 오버랙 방지), 카드 브러시(#1F1F25)는 앱 토큰 재사용. 밀도는 B·C보다 낮아 스크롤이 늘어나는 트레이드오프.",
    css: { "--rh": "32px", "--pv": "0px", "--ph": "0px", "--m-v": "1px", "--m-h": "4px",
           "--extra-v": "0px", "--chev-w": "10px", "--gap-chev": "5px",
           "--gap-count": "8px", "--count-r": "8px", "--font-t": "12px", "--font-c": "11px",
           "--radius": "5px", "--sel-bg": "#26E8A33D",
           "--row-bg": "#1F1F2566" },
    geo: `행 피치: 34px (32 + 공극 1×2) = 목록 리듬 유지
셰브런 칸: 10px · 간격 5px
글자: 제목 12px · 카운트 11px · 행 배경 카드(#1F1F25 40%)
적용: EoleTreeItemStyle + 템플릿 행 배경/마진 수정 (약간 더 큰 작업)`,
  },
};

const tree = document.getElementById("tree");
tree.innerHTML = treeData.map(d => `
  <li><div class="row ${d.sel ? "sel" : ""}">
    <span class="chev">${d.chev ?? ""}</span>
    <span class="title ${d.indent ? "indent1" : ""}">${d.t}</span>
    <span class="count">${d.c}</span>
  </div></li>`).join("");

const tabs = document.getElementById("tabs");
Object.keys(VARIANTS).forEach(k => {
  const b = document.createElement("button");
  b.innerHTML = `<b>${k}</b>${VARIANTS[k].name.split("— ")[1]}`;
  b.dataset.v = k;
  b.addEventListener("click", () => select(k));
  tabs.appendChild(b);
});

function select(k) {
  const v = VARIANTS[k];
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.v === k));
  const r = document.documentElement.style;
  for (const [key, val] of Object.entries(v.css)) r.setProperty(key, val);
  document.getElementById("d-name").textContent = v.name;
  document.getElementById("d-why").innerHTML = v.why;
  document.getElementById("d-geo").textContent = v.geo;
}
select("B");
</script>
</body>
</html>
